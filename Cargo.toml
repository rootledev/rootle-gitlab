[package]
name = "rootle-gitlab"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "GitLab provider for rootle — speaks the rootle stdio NDJSON-RPC provider protocol over GitLab's REST v4 API"
repository = "https://github.com/rootledev/rootle-gitlab"
readme = "README.md"
keywords = ["tui", "gitlab", "rootle", "provider"]
categories = ["command-line-utilities"]
# The crate ships source + README + LICENSE only; the CI stays in the
# repo (same policy as rootle).
exclude = ["/.github"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rootle-gitlab"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
dirs = "6"
parking_lot = "0.12.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
filetime = "0.2.29"
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"
