name: live

# Live validation vs gitlab.com (plans/0009 M6): the real rootle TUI
# through this adapter against the real API. Dispatch-only — costs
# quota and needs the GITLAB_TOKEN secret (read_api +
# read_repository).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build adapter + rootle
        run: |
          cargo build --locked
          cargo install --git https://github.com/rootledev/rootle --locked --root /tmp/rootle-install

      - name: Drive the full stack (search → open → tree → preview)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocol":1}}' \
            '{"jsonrpc":"2.0","id":2,"method":"search/repos","params":{"query":"gitlab-runner"}}' \
            | ./target/debug/rootle-gitlab > /tmp/replies.jsonl
          grep -q '"name":"gitlab"' /tmp/replies.jsonl
          grep -q 'gitlab-runner' /tmp/replies.jsonl
          echo "protocol surface live: ok"
