name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build gate (fmt, clippy, wiremock conformance)
        run: docker compose run --build --rm test

  # The canonical provider conformance suite (rootledev/forge-conformance,
  # plans/0015) against THIS adapter: examples/forge.rs serves the
  # canonical fixture through a local GitLab REST v4 mock and runs the
  # real handler against it — the numbered FC case matrix, protocol v1.3.
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rootledev/forge-conformance
          # Pinned: 7302996 roots the adapter cache beside the fixture
          # (never inside it) — the revision the harness is written for.
          # Bump deliberately; suite main is not a moving dependency.
          ref: 7302996778c0358bed5eb9ee99dcf9e38bfa0363
          path: forge-conformance
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Build the fixture harness
        run: cargo build --locked --example forge
      - name: Suite vs this adapter
        run: python3 forge-conformance/run -- "$PWD/target/debug/examples/forge"
